services:
  mysql:
    image: mysql@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    environment:
      MYSQL_ROOT_PASSWORD: opencart
      MYSQL_DATABASE: opencart
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-popencart"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - opencart_test

  php82:
    build:
      context: ..
      dockerfile: tests/Dockerfile.php82
    depends_on:
      mysql:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OC_DB_HOSTNAME: host.docker.internal
      OC_DB_PORT: 3307
      OC_DB_USERNAME: root
      OC_DB_PASSWORD: opencart
      OC_DB_DATABASE: opencart
      OC_DB_SCHEMA_DATABASE: oc_schema
    volumes:
      - ..:/app
    working_dir: /app
    networks:
      - opencart_test

  php84:
    build:
      context: ..
      dockerfile: tests/Dockerfile.php84
    depends_on:
      mysql:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OC_DB_HOSTNAME: host.docker.internal
      OC_DB_PORT: 3307
      OC_DB_USERNAME: root
      OC_DB_PASSWORD: opencart
      OC_DB_DATABASE: opencart
      OC_DB_SCHEMA_DATABASE: oc_schema
    volumes:
      - ..:/app
    working_dir: /app
    networks:
      - opencart_test

networks:
  opencart_test:
    driver: bridge
